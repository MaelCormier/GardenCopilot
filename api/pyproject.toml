[project]
name = "garden"
version = "0.1.0"
description = "Assistant jardin agentique — RAG, MCP, diagnostic photo"
readme = "README.md"
authors = [
    { name = "MaelCormier", email = "mael.cormier@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
garden = "garden:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
