[project]
name = "garden"
version = "0.1.0"
description = "Assistant jardin agentique — RAG, MCP, diagnostic photo"
readme = "README.md"
authors = [
    { name = "MaelCormier", email = "mael.cormier@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle (style)
    "F",        # pyflakes (erreurs, imports inutiles)
    "I",        # isort (tri des imports)
    "N",        # pep8-naming (conventions de nommage)
    "UP",       # pyupgrade (syntaxe moderne)
    "B",        # bugbear (pièges courants)
    "SIM",      # simplify (code simplifiable)
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
